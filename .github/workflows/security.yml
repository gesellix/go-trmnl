name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily at 02:00 UTC.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulnerability-scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  static-analysis:
    name: Static Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload the Semgrep SARIF to code scanning
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      # Run the Semgrep CLI directly (the semgrep-action wrapper is deprecated).
      # `semgrep scan` exits 0 even with findings; results are surfaced via the
      # SARIF upload to code scanning. continue-on-error keeps the job green when
      # the scan or upload cannot run (e.g. SARIF upload on a forked-PR token).
      - name: Run Semgrep
        run: |
          python3 -m pip install --quiet --disable-pip-version-check semgrep
          semgrep scan --sarif --output=semgrep.sarif \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/golang
        continue-on-error: true

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
        continue-on-error: true

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [vulnerability-scan, static-analysis]
    if: always()
    steps:
      - name: Summary
        run: |
          {
            echo "## Security Scan Results"
            echo ""
            echo "- Vulnerability scan (govulncheck): ${{ needs.vulnerability-scan.result }}"
            echo "- Static analysis (staticcheck/semgrep): ${{ needs.static-analysis.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on issues
        if: needs.vulnerability-scan.result == 'failure' || needs.static-analysis.result == 'failure'
        run: exit 1
