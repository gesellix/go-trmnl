<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <!-- The site is static: no scripts, no third-party resources, own stylesheet only. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'; frame-ancestors 'none'">
</head>
<body>
  <header class="wrap">
    <!-- These links are literal paths through relative_url, not user input. -->
    <!-- nosemgrep: generic.html-templates.security.var-in-href.var-in-href -->
    <a class="brand" href="{{ '/' | relative_url }}">go-trmnl</a>
    <nav>
      <a href="https://github.com/{{ site.repository }}#readme">Docs</a>
      <a href="https://github.com/{{ site.repository }}/releases/latest">Download</a>
      <a href="https://github.com/{{ site.repository }}">GitHub</a>
    </nav>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="wrap">
    <!-- nosemgrep: generic.html-templates.security.var-in-href.var-in-href -->
    <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
    <!-- nosemgrep: generic.html-templates.security.var-in-href.var-in-href -->
    <a href="{{ '/terms/' | relative_url }}">Terms of Service</a>
    <a href="https://github.com/{{ site.repository }}/blob/main/LICENSE">MIT License</a>
  </footer>
</body>
</html>
